name: Windows desktop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Check out Shadowsh
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend tools
        run: npm install --no-audit --no-fund

      - name: Verify practice splitting and frontend syntax
        run: |
          npm run check:web
          npm test

      - name: Generate Windows icons
        run: npm run icon

      - name: Test native backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Upload Shadowsh installer
        uses: actions/upload-artifact@v4
        with:
          name: Shadowsh-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
